# Podgląd www/ — odwzorowuje zachowanie preview-server.ps1:
# czyste adresy katalogowe, 404.html jako strona błędu, HTML bez cache'owania.
server {
    listen 80;
    server_name localhost;
    # Katalog strony leży wewnątrz montowanego /site — patrz komentarz
    # przy wolumenie usługi `web` w docker-compose.yml.
    root /site/www;
    index index.html;

    charset utf-8;
    charset_types text/html text/css text/javascript application/json application/xml;

    # /kotly-parowe/odkamienianie/ → .../index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # API panelu redakcyjnego — ten sam origin co strona, więc panel może
    # z niego korzystać nie łamiąc CSP `connect-src 'self'`.
    # Tylko podgląd lokalny; na produkcji tej lokalizacji nie ma.
    location /api/ {
        # Nazwę rozwiązujemy przy każdym żądaniu przez DNS Dockera (127.0.0.11).
        # Ze stałym proxy_pass nginx zapamiętuje IP przy starcie i po odtworzeniu
        # kontenera admin-api zwraca 502, dopóki sam się nie zrestartuje.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_api http://admin-api:8125;
        proxy_pass $admin_api$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # /api/publish uruchamia pełny build
        add_header Cache-Control "no-store" always;
    }

    # HTML zawsze świeży — podgląd ma pokazywać ostatni build
    location ~* \.html$ {
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Arkusze i skrypty w podglądzie NIE są cache'owane. Ich adres nosi stały
    # znacznik ?v=, który zmienia się raz na wydanie, więc przy pracy nad CSS
    # przeglądarka uparcie serwowała wersję sprzed poprawki. Na produkcji
    # cache'owaniem steruje plik _headers, nie ta konfiguracja.
    # Musi stać PRZED regułą /assets/.
    location ~* ^/assets/.+\.(css|js)$ {
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Assety są wersjonowane w adresie (?v=…), więc mogą leżeć w cache
    location /assets/ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Podgląd lokalny — nie indeksujemy go przypadkiem
    add_header X-Robots-Tag "noindex, nofollow" always;
}
